<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Pipa Realista - Tibau do Sul</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            transition: width 0.1s, height: 0.1s;
        }
        .crosshair.ads {
            width: 4px;
            height: 4px;
            border-color: #ff3333;
        }
        #instruction-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #instruction-screen h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 32px;
        }
        #instruction-screen p {
            font-size: 16px;
            color: #cbd5e1;
            max-width: 500px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-play {
            background-color: #eab308;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-play:hover {
            background-color: #ca8a04;
            transform: scale(1.05);
        }
        #reload-msg {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 18px;
            font-weight: bold;
            display: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div id="instruction-screen">
        <h1>🌴 Operação Pipa (Versão Realista) 🌊</h1>
        <p>Use <b>W, A, S, D</b> para andar, <b>MOUSE</b> para olhar, <b>BOTÃO DIREITO</b> para mirar (ADS), <b>ESPAÇO</b> para pular e <b>R</b> para recarregar.</p>
        <button class="btn-play" id="play-btn">ENTRAR NO JOGO</button>
    </div>

    <div id="hud">
        <div class="hud-top">
            <div>📍 PIPA / RUA REALISTA</div>
            <div>ALVOS ELIMINADOS: <span id="score">0</span></div>
            <div>MUNIÇÃO: <span id="ammo">30</span>/30</div>
        </div>
    </div>

    <div id="reload-msg">RECARREGANDO... (Pressione R)</div>
    <div class="crosshair" id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        let score = 0;
        let ammo = 30;
        let maxAmmo = 30;
        let isReloading = false;
        let isAds = false;
        let gunGroup, muzzleFlashLight;
        let bots = [];
        let audioCtx;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2869a8); // Céu realista mais profundo
            scene.fog = new THREE.FogExp2(0x2869a8, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            document.getElementById('play-btn').addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                document.getElementById('instruction-screen').style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                document.getElementById('instruction-screen').style.display = 'flex';
            });

            // Luzes realistas
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.5);
            sunLight.position.set(40, 60, 40);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Carregador de Texturas para realismo
            const textureLoader = new THREE.TextureLoader();

            // Textura de Rua / Paralelepípedo Realista
            const streetTex = textureLoader.load('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600');
            streetTex.wrapS = THREE.RepeatWrapping;
            streetTex.wrapT = THREE.RepeatWrapping;
            streetTex.repeat.set(5, 30);
            
            const streetGeo = new THREE.PlaneGeometry(35, 180);
            const streetMat = new THREE.MeshStandardMaterial({ map: streetTex, roughness: 0.8 });
            const street = new THREE.Mesh(streetGeo, streetMat);
            street.rotation.x = -Math.PI / 2;
            street.receiveShadow = true;
            scene.add(street);

            // Calçadas
            const sidewalkGeo = new THREE.PlaneGeometry(30, 180);
            const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xc2a685, roughness: 0.9 });
            
            const sidewalkLeft = new THREE.Mesh(sidewalkGeo, sidewalkMat);
            sidewalkLeft.position.set(-32.5, -0.02, 0);
            sidewalkLeft.rotation.x = -Math.PI / 2;
            scene.add(sidewalkLeft);

            const sidewalkRight = new THREE.Mesh(sidewalkGeo, sidewalkMat);
            sidewalkRight.position.set(32.5, -0.02, 0);
            sidewalkRight.rotation.x = -Math.PI / 2;
            scene.add(sidewalkRight);

            // Texturas de Lojinhas / Paredes Realistas (Estucadas e de Tijolo)
            const wallTex1 = textureLoader.load('https://images.unsplash.com/photo-1558442084-fa637f1b11ef?w=600');
            const wallTex2 = textureLoader.load('https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600');

            for (let i = -70; i <= 70; i += 18) {
                let matL = new THREE.MeshStandardMaterial({ map: wallTex1, roughness: 0.5 });
                let houseL = new THREE.Mesh(new THREE.BoxGeometry(12, 10, 15), matL);
                houseL.position.set(-23, 5, i);
                houseL.castShadow = true;
                houseL.receiveShadow = true;
                scene.add(houseL);

                let matR = new THREE.MeshStandardMaterial({ map: wallTex2, roughness: 0.5 });
                let houseR = new THREE.Mesh(new THREE.BoxGeometry(12, 10, 15), matR);
                houseR.position.set(23, 5, i);
                houseR.castShadow = true;
                houseR.receiveShadow = true;
                scene.add(houseR);
            }

            createObstacles();
            createWeapon();
            spawnBots();

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('resize', onWindowResize);
        }

        function createObstacles() {
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x4a3319, roughness: 0.6 });
            const obstaclesData = [
                { x: -6, z: -15, w: 4, h: 3, d: 4 },
                { x: 6, z: -30, w: 5, h: 3.5, d: 3 },
                { x: -4, z: -45, w: 3.5, h: 4, d: 5 },
                { x: 5, z: -60, w: 5, h: 3, d: 5 }
            ];

            obstaclesData.forEach(data => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d), obsMat);
                mesh.position.set(data.x, data.h / 2, data.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            });
        }

        function createWeapon() {
            gunGroup = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.6, roughness: 0.3 });
            const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.16, 0.85), bodyMat);
            gunBody.position.set(0.2, -0.2, -0.5);
            gunGroup.add(gunBody);

            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.55), barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0.2, -0.15, -0.85);
            gunGroup.add(barrel);

            muzzleFlashLight = new THREE.PointLight(0xff9900, 0, 3);
            muzzleFlashLight.position.set(0.2, -0.15, -1.1);
            gunGroup.add(muzzleFlashLight);

            camera.add(gunGroup);
            scene.add(camera);
        }

        function spawnBots() {
            const botGeo = new THREE.BoxGeometry(1.2, 2.2, 1.2);
            const botMat = new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.4 });

            for (let i = 0; i < 5; i++) {
                const bot = new THREE.Mesh(botGeo, botMat);
                const x = (Math.random() - 0.5) * 20;
                const z = -20 - (i * 15);
                bot.position.set(x, 1.1, z);
                bot.castShadow = true;
                bot.userData = { health: 100, maxHealth: 100 };
                scene.add(bot);
                bots.push(bot);
            }
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space':
                    if (canJump) velocity.y += 8;
                    canJump = false;
                    break;
                case 'KeyR': reloadWeapon(); break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseDown(event) {
            if (!controls.isLocked) return;
            if (event.button === 0) shoot();
            if (event.button === 2) toggleADS(true);
        }

        function onMouseUp(event) {
            if (event.button === 2) toggleADS(false);
        }

        function toggleADS(enable) {
            isAds = enable;
            const crosshair = document.getElementById('crosshair');
            if (enable) {
                camera.fov = 40;
                crosshair.classList.add('ads');
                gunGroup.position.set(-0.05, 0.05, 0.15);
            } else {
                camera.fov = 75;
                crosshair.classList.remove('ads');
                gunGroup.position.set(0, 0, 0);
            }
            camera.updateProjectionMatrix();
        }

        function shoot() {
            if (isReloading || ammo <= 0) return;

            ammo--;
            document.getElementById('ammo').innerText = ammo;
            playGunshotSound();

            gunGroup.position.z += 0.08;
            muzzleFlashLight.intensity = 4;
            setTimeout(() => {
                gunGroup.position.z -= 0.08;
                muzzleFlashLight.intensity = 0;
            }, 60);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(bots);

            if (intersects.length > 0) {
                const hitBot = intersects[0].object;
                hitBot.userData.health -= 50;
                hitBot.material.color.setHex(0xffffff);
                setTimeout(() => hitBot.material.color.setHex(0xcc3333), 150);

                if (hitBot.userData.health <= 0) {
                    score++;
                    document.getElementById('score').innerText = score;
                    respawnBot(hitBot);
                }
            }

            if (ammo === 0) document.getElementById('reload-msg').style.display = 'block';
        }

        function reloadWeapon() {
            if (isReloading || ammo === maxAmmo) return;
            isReloading = true;
            document.getElementById('reload-msg').style.display = 'block';
            setTimeout(() => {
                ammo = maxAmmo;
                isReloading = false;
                document.getElementById('ammo').innerText = ammo;
                document.getElementById('reload-msg').style.display = 'none';
            }, 1200);
        }

        function respawnBot(bot) {
            bot.userData.health = bot.userData.maxHealth;
            bot.position.z = -70 - Math.random() * 30;
            bot.position.x = (Math.random() - 0.5) * 22;
        }

        function playGunshotSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 4.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = isAds ? 6.0 : 12.0;

                if (moveForward || moveBackward) velocity.z -= direction.z * speed * 8.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * 8.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.y += (velocity.y * delta);

                if (camera.position.y < 1.6) {
                    velocity.y = 0;
                    camera.position.y = 1.6;
                    canJump = true;
                }

                bots.forEach(bot => {
                    bot.position.z += 4.0 * delta;
                    if (bot.position.z > camera.position.z + 5) respawnBot(bot);
                });
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
